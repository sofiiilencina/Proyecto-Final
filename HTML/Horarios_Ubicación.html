<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horarios y Ubicación</title>
        <link rel="stylesheet" href="Horarios_Ubicación.css">
</head>
<body>
    <div id="contenedor">
        <h1 class="fondo">Horarios</h1>
            <div class="horarios-container">
                <h2>Horarios de Atención</h2>
                <div class="dia-horario">
                    <span class="dia">Lunes</span>
                    <span class="horario">12:00 - 15:00 y 19:30 - 23:00</span>
                </div>
                <div class="dia-horario">
                    <span class="dia">Martes</span>
                    <span class="horario">Cerrado</span>
                </div>
                <div class="dia-horario">
                    <span class="dia">Miércoles</span>
                    <span class="horario">12:00 - 15:00 y 19:30 - 23:00</span>
                 </div>
                <div class="dia-horario">
                    <span class="dia">Jueves</span>
                    <span class="horario">12:00 - 15:00 y 19:30 - 23:30</span>
                </div>
                <div class="dia-horario">
                    <span class="dia">Viernes</span>
                    <span class="horario">12:00 - 15:00 y 19:30 - 00:00</span>
                </div>
                <div class="dia-horario">
                    <span class="dia">Sábado</span>
                    <span class="horario">12:30 - 00:00 (Jornada Continua)</span>
                </div>
                <div class="dia-horario">
                    <span class="dia">Domingo</span>
                    <span class="horario">12:30 - 23:00 (Jornada Continua)</span>
                </div>
            </div>

        <h1 class="fondo">Ubicación</h1>
        <div id="cuerpo">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3102.64938072895!2d-68.10007078827134!3d-38.95483767159384!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x960a3308424d7afd%3A0x300759ce4062fb02!2sSan%20Mart%C3%ADn%202701-2799%2C%20Q8302%20Neuqu%C3%A9n!5e0!3m2!1sen!2sar!4v1762199487228!5m2!1sen!2sar" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>


    </div>
</body>
</html>
